name: windows playable build
# mw1-original: manual only (to save Actions minutes); run before a milestone.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      label:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0 # the tags: a release's label is packaged only from its tag
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 535d80badefc83c5c527ec5748f2a20d6a9310fe # SDL 3.2.0
          path: dependencies/SDL
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake
        run: python -m pip install cmake==3.31.6
      - name: The music soundfont's pinned source (tools/deps/fetch_soundfont.sh)
        uses: actions/cache@v4
        with:
          path: build-deps/soundfont
          key: soundfont-2621acaa1c78e4abdb24bdd163230cc577e61276936d6aa6e3180582142f0343
      - name: Fetch the soundfont source if not cached
        run: python tools/soundfont/subset.py fetch
      - name: Build and verify extracted runtime package
        env:
          PACKAGE_LABEL: ${{ inputs.label || github.sha }}
        run: python tools/build_package.py --sdl dependencies/SDL --label "$PACKAGE_LABEL"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
