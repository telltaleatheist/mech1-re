; The length of one combat tick in milliseconds at 1x speed, the same on any
; computer. See docs/CPU_TIMING_PROFILE.md. Allowed: 20..500. 60 is about
; 2.1 times as fast as the earlier cycle model's 127 ms. Does not change the
; PIT clock, sound pitch or the original movement arithmetic.
combat_tick_ms=60
; Combat speed step, 1..4: each tick lasts combat_tick_ms divided by it.
; In combat, the main-row - and = (+) keys change it; the game remembers the
; choice in the player's own MechWarrior.ini, beside the saves.
combat_speed=1
; The launcher defaults to this port's assets/original-game installation.
; Override with -GameDirectory or MECHWARRIOR_ASSET_DIRECTORY if needed.
; Sound device: speaker, mt32 or adlib. The selected card remains active through
; combat. The original combat bank supplies PC-speaker effects alongside it.
sound_system=speaker
; The rebuild's music: uncomment to play the songs from the bundled soundfont
; instead (no ROMs; overrides sound_system). See docs/AUDIO.md.
; music=soundfont
; MT-32 requires a compatible, legally supplied CONTROL and PCM ROM pair.
; Paths may be absolute or relative to this INI. No ROMs ship with the port.
mt32_control_rom=
mt32_pcm_rom=
